name: Playwright

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  playwright:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Start app with Docker Compose
        run: docker compose up -d --build

      - name: Wait for app services
        run: |
          for url in http://localhost:5180/api/alerts http://localhost:5173; do
            for attempt in $(seq 1 30); do
              if curl --fail --silent "$url" > /dev/null; then
                break
              fi
              sleep 2
            done
            curl --fail --silent "$url" > /dev/null
          done

      - name: Run rates browser tests
        working-directory: frontend
        run: npx playwright test --project=e2e tests/e2e/rates.e2e.spec.ts

      - name: Run alerts API tests
        working-directory: frontend
        run: npx playwright test --project=api tests/api/alerts.api.spec.ts

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Stop app
        if: always()
        run: docker compose down
