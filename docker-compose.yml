services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:5180
      DOTNET_USE_POLLING_FILE_WATCHER: "1"
    ports:
      - "5180:5180"
    volumes:
      - ./backend:/app
      - backend-bin:/app/bin
      - backend-obj:/app/obj

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      API_PROXY_TARGET: http://backend:5180
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
    depends_on:
      - backend

volumes:
  backend-bin:
  backend-obj:
  frontend-node-modules: